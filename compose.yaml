services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: kamble
      POSTGRES_PASSWORD: kamble
      POSTGRES_DB: kamble
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kamble"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
