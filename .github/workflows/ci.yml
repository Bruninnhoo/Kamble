name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kamble
          POSTGRES_PASSWORD: kamble
          POSTGRES_DB: kamble
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kamble"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kamble:kamble@localhost:5432/kamble
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kamble/api exec prisma generate
      - run: pnpm --filter @kamble/api exec prisma migrate deploy
      - name: Check schema drift
        run: >-
          pnpm --filter @kamble/api exec prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: docker build --file apps/api/Dockerfile .

  publish:
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/bruninnhoo/kamble-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - run: >-
          docker build
          --file apps/api/Dockerfile
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --tag "$IMAGE" .
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "$IMAGE"
